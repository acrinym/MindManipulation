[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pysbagen"
version = "0.4.0"
description = "Local-first SBaGen/DRG compatibility, living-session memory, and layered audio studio"
readme = "README.md"
license = "GPL-2.0-only"
authors = [{name="Justin (acrinym)"}]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "soundfile>=0.12",
  "scipy>=1.13"
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1.2"]
gui = ["matplotlib>=3.8", "pillow>=10"]
playback = ["pyaudio>=0.2.14"]
desktop = ["matplotlib>=3.8", "pillow>=10", "pyaudio>=0.2.14"]

[project.scripts]
sbgpy = "pysbagen.cli:main"
sbgpy-gui = "gui_safe:main"
sbgpy-inspect = "pysbagen.inspect_cli:main"
sbgpy-inspect-gui = "inspect_gui:main"
sbgpy-sleep = "pysbagen.sleep_cli:main"
sbgpy-sleep-gui = "sleep_gui:main"
sbgpy-session = "pysbagen.session_cli:main"
sbgpy-confluence = "pysbagen.confluence_cli:main"

[project.entry-points."pysbagen.generators"]
# Third parties can register generator plugins in this group.

[tool.setuptools]
py-modules = ["gui", "gui_safe", "inspect_gui", "sleep_gui", "visualization", "drg_decoder"]

[tool.setuptools.packages.find]
where = ["."]
include = ["pysbagen", "pysbagen.*"]
exclude = ["pysbagen.src", "pysbagen.src.*", "pysbagen.tests", "pysbagen.tests.*"]

[tool.pytest.ini_options]
testpaths = ["pysbagen/tests"]
addopts = "-q"

[tool.setuptools.package-data]
pysbagen = ["data/*.json"]
